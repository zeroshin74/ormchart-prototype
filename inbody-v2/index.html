<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인바디 결과 분석</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="window">
  <!-- 창 타이틀바 -->
  <div id="titlebar">
    <span>인바디 결과 분석</span>
    <span class="win-controls"><span>─</span><span>□</span><span>✕</span></span>
  </div>

  <!-- 환자 헤더 -->
  <div id="patient-bar">
    <span class="p-name">이요원 <small>(32세/여)</small></span>
    <span class="p-meta">
      <span>cn.57</span><span class="sep">|</span><span>1989.10.04</span>
    </span>
    <select><option>인바디 결과지</option></select>
    <span class="spacer"></span>
    <button class="btn-outline" id="extras-toggle" title="Δ요약·목표선·구간 통계 표시 (단순 산술·표시 기능)">추가제안</button>
    <button class="btn-outline">기본설정 조회</button>
  </div>

  <!-- 컨트롤 바 -->
  <div id="control-bar">
    <div class="mode-toggle" id="mode-toggle">
      <button data-mode="trend">항목별 추이</button>
      <button data-mode="compare" class="active">지표 변화 비교</button>
    </div>

    <div class="zoom-box">
      <button id="zoom-in">+확대</button>
      <span class="pct" id="zoom-pct">75%</span>
      <button id="zoom-out">-축소</button>
    </div>

    <button class="icon-btn" id="metric-btn" title="표시 지표 설정">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="2" y1="5" x2="16" y2="5"/><circle cx="7" cy="5" r="2" fill="#fff"/>
        <line x1="2" y1="12" x2="16" y2="12"/><circle cx="12" cy="12" r="2" fill="#fff"/>
      </svg>
    </button>

    <span class="spacer"></span>

    <div class="preset-group" id="preset-group">
      <button data-days="30">1개월</button>
      <button data-days="90">3개월</button>
      <button data-days="180">6개월</button>
      <button data-days="365">1년</button>
      <button data-days="0" class="active">전체</button>
    </div>

    <div class="date-range">
      <input id="date-from" placeholder="yyyy.mm.dd" />
      <span style="color:#b9c0cd">–</span>
      <input id="date-to" placeholder="yyyy.mm.dd" />
      <button class="btn-primary" id="date-apply">조회</button>
    </div>

    <div class="layout-toggle">
      <button class="icon-btn" id="layout-toggle" title="카드형으로 보기"></button>
    </div>
  </div>

  <!-- 표시 지표 설정 팝오버 -->
  <div id="metric-pop"></div>

  <!-- 메인 -->
  <div id="main">
    <div id="main-scroll">
      <div id="content">
        <!-- JS 렌더링 -->
        <div id="crosshair"></div>
      </div>
    </div>
  </div>
</div>

<!-- 툴팁 플로팅 레이어 (최상위, 클리핑 없음) -->
<div id="floating"></div>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
